name: Apply transaction currency patch

on:
  push:
    branches:
      - chore/dragg-tr-staging
    paths:
      - .github/patches/APPLY_TRANSACTION_CURRENCY

permissions:
  contents: write

jobs:
  apply:
    name: Apply guarded transaction currency patch
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Apply guarded replacements
        run: python .github/patches/apply-transaction-currency-symbol.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/transaction-form.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix: use active currency symbol in transaction form"
          git push
