name: Apply P1 Turkey Patch

on:
  push:
    branches:
      - chore/dragg-tr-staging
    paths:
      - .github/patches/APPLY_P1

permissions:
  contents: write

jobs:
  apply:
    name: Apply guarded Turkey patch
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Apply guarded replacements
        run: python .github/patches/apply-p1.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/i18n.tsx lib/finance/transactions.ts tests/lib/finance/transactions-crud.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: apply guarded Turkey locale and payment patch"
          git push
