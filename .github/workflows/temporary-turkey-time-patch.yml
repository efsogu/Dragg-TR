name: Temporary Turkey Time Patch

on:
  push:
    branches:
      - chore/dragg-tr-staging

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Patch finance core to Turkey calendar
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          finance_path = Path("lib/finance/transactions.ts")
          source = finance_path.read_text(encoding="utf-8")

          import_anchor = 'import { createClient } from "@/lib/supabase/server";\n'
          calendar_import = 'import { getTurkeyDateValue, getTurkeyMonthValue } from "@/lib/time/turkey-calendar";\n'
          if calendar_import not in source:
              if import_anchor not in source:
                  raise SystemExit("Supabase import anchor not found")
              source = source.replace(import_anchor, import_anchor + calendar_import, 1)

          old_helpers = '''function getCurrentMonthValue() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
          }

          function getTodayValue() {
            return new Date().toISOString().slice(0, 10);
          }'''
          new_helpers = '''function getCurrentMonthValue() {
            return getTurkeyMonthValue();
          }

          function getTodayValue() {
            return getTurkeyDateValue();
          }'''
          if old_helpers not in source:
              raise SystemExit("Finance date helper block not found")
          source = source.replace(old_helpers, new_helpers, 1)
          finance_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/lib/time/finance-turkey-calendar-wiring.test.ts")
          test_path.write_text('''import { readFileSync } from "node:fs";\n\nimport { describe, expect, it } from "vitest";\n\ndescribe("finance core Turkey calendar wiring", () => {\n  it("uses the Istanbul calendar helpers for the current day and month", () => {\n    const source = readFileSync(\n      new URL("../../../lib/finance/transactions.ts", import.meta.url),\n      "utf8",\n    );\n\n    expect(source).toContain(\n      'import { getTurkeyDateValue, getTurkeyMonthValue } from "@/lib/time/turkey-calendar";',\n    );\n    expect(source).toMatch(\n      /function getCurrentMonthValue\\(\\) {\\s+return getTurkeyMonthValue\\(\\);\\s+}/,\n    );\n    expect(source).toMatch(\n      /function getTodayValue\\(\\) {\\s+return getTurkeyDateValue\\(\\);\\s+}/,\n    );\n    expect(source).not.toContain("new Date().toISOString().slice(0, 10)");\n  });\n});\n''', encoding="utf-8")
          PY

          git diff --check
          git diff --exit-code --quiet && {
            echo "Expected Turkey calendar patch produced no changes" >&2
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/finance/transactions.ts tests/lib/time/finance-turkey-calendar-wiring.test.ts
          git commit -m "fix(time): use Istanbul calendar in finance core"
          git push origin "HEAD:${GITHUB_REF_NAME}"
